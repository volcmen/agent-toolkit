[package]
name = "sbg-fx"
version = "0.1.0"
edition = "2021"
description = "CPU-only animated background effects plugin for Tattoy"
license = "MIT"
publish = false

[workspace]
members = ["sbg-term"]
resolver = "2"

[[bin]]
name = "sbg-fx"
path = "src/main.rs"

[features]
default = ["lua54"]
lua54 = ["mlua/lua54"]
luajit = ["mlua/luajit"]

[dependencies]
tattoy-protocol = "0.1.1"
serde_json = "1"
mlua = { version = "0.10", features = ["vendored"] }
libc = "0.2"

[dev-dependencies]
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
