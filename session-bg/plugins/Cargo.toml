[package]
name = "sbg-fx"
version = "0.1.0"
edition = "2021"
description = "CPU-only animated background effects plugin for Tattoy"
license = "MIT"
publish = false

[[bin]]
name = "sbg-fx"
path = "src/main.rs"

[dependencies]
tattoy-protocol = "0.1.1"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
