name: check

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: "1.4.0"
      - name: install ChatGPT Consult dependencies
        run: bun install --frozen-lockfile
        working-directory: chatgpt-consult
      # The rendered manifests must match plugins.json, every catalogued plugin
      # must be well formed, and each project's own suite must pass.
      - run: python3 scripts/plugins.py sync --check
      # A virtual display stays available for any suite that drives a real
      # Chrome-family browser through Bun.WebView.
      - run: xvfb-run -a python3 scripts/plugins.py check
